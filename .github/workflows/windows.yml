name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\.local\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - run: pnpm test
      - run: pnpm audit:native
      - run: pnpm exec playwright install chrome
      - run: pnpm test:about
      - run: pnpm test:topic-discovery
      - run: pnpm test:home-content
      - run: pnpm test:plugin-pagination
      - run: pnpm test:features
      - run: pnpm test:auto-pagination
      - run: pnpm test:resource-retry
      - run: pnpm test:guest-comments
      - run: pnpm test:verification-renderer
      - run: pnpm test:hot-topics
      - run: pnpm test:media
      - run: pnpm test:catalog
      - run: pnpm test:app-discovery
      - run: pnpm test:app-media
      - run: pnpm test:user-discovery
      - run: pnpm test:community
      - run: pnpm test:topic-search
      - run: pnpm test:vote-comments
      - run: pnpm test:reply-visibility
      - run: pnpm test:notifications
      - run: pnpm test:article
      - run: pnpm test:publishing
      - run: pnpm test:creation
      - run: pnpm test:personal
      - run: pnpm test:account-overview
      - run: pnpm test:settings
      - run: pnpm test:desktop-settings
      - run: pnpm test:image-settings
      - run: pnpm test:image-viewer-zoom
      - run: pnpm test:desktop-polish
      - run: pnpm test:entity-posters
      - run: pnpm test:account-settings
      - run: pnpm test:teenager
      - run: pnpm test:updates-ui
      - run: pnpm test:live-photo
      - run: node scripts/test-live-photo-ui.mjs
      - run: pnpm test:goods
      - run: pnpm test:secondhand
      - run: pnpm test:secondhand-publishing
      - run: pnpm test:downloads
      - run: pnpm test:sharing
      - run: pnpm build
      - run: pnpm test:branding-native
      - run: pnpm test:image-viewer-native
      - run: pnpm test:download-directory-native
      - run: pnpm test:home-native
      - run: pnpm test:desktop-motion
      - run: pnpm test:material-preferences
      - run: pnpm test:desktop-layout
      - run: pnpm test:parity-integration
      - run: pnpm test:teenager-native
      - run: pnpm test:account
      - run: pnpm test:account-relations
      - run: pnpm test:navigation
      - run: pnpm test:search
      - run: pnpm test:settings-native
      - run: pnpm test:updates-native
      - run: pnpm package
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - run: pnpm test:package
      - run: |
          pnpm verify:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath research/release-manifest.json -Destination release/release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Coolapk-Windows-x64
          path: |
            release/Coolapk-Desktop-*-x64.exe
            release/Coolapk-Desktop-Setup-*-x64.exe.blockmap
            release/latest.yml
            release/release-manifest.json
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Marginal-Z/coolapk-for-windows'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: coolapk-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Coolapk-Windows-x64
          path: release
      - name: Publish verified installer and stable update feed
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
