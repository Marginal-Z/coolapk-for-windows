name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\.local\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - run: pnpm test
      - run: pnpm exec playwright install chrome
      - run: pnpm test:features
      - run: pnpm test:media
      - run: pnpm test:catalog
      - run: pnpm test:app-discovery
      - run: pnpm test:user-discovery
      - run: pnpm test:community
      - run: pnpm test:article
      - run: pnpm test:publishing
      - run: pnpm test:live-photo
      - run: node scripts/test-live-photo-ui.mjs
      - run: pnpm test:goods
      - run: pnpm test:secondhand
      - run: pnpm test:downloads
      - run: pnpm test:sharing
      - run: pnpm build
      - run: pnpm test:account
      - run: pnpm test:navigation
      - run: pnpm test:search
      - run: pnpm package
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - run: |
          pnpm verify:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath research/release-manifest.json -Destination release/release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Coolapk-Windows-x64
          path: |
            release/Coolapk-Desktop-*-x64.exe
            release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
