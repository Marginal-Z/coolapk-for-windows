name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ github.workspace }}\.local\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - run: pnpm test
      - run: pnpm exec playwright install chromium
      - run: pnpm test:features
      - run: pnpm test:media
      - run: pnpm package
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.local\builder-cache
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Coolapk-Windows-x64
          path: release/Coolapk-Desktop-*-x64.exe
          if-no-files-found: error
          compression-level: 0
